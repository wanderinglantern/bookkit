[project]
name = "bookkit"
version = "0.1.0"
description = "Local single-user CRM for an insurance broker's book of business — terminal app over SQLite, integrated with towerkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "towerkit",
    "pydantic>=2.7",
    # upper bound is load-bearing: account.py::_settle_tables drives four
    # private DataTable attributes, and tests/test_tui.py pins that they
    # still exist. >=0.58 was three majors below what we actually run.
    "textual>=8.2,<9",
    "rapidfuzz>=3.6",
    "babel>=2.14",
    "dateparser>=1.4.2",
    "humanize>=4.9",
    "textual-autocomplete>=4.0",
    "mcp>=2.0",
]

[project.scripts]
bookctl = "bookkit.cli:main"

[tool.uv]
default-groups = []

[tool.uv.sources]
towerkit = { path = "../towerkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-asyncio>=1.4.0",
    # visual regression: reads the snapshots the suite used to only write.
    # >=1.1 is load-bearing, not hygiene: 1.0 renders SVG differently and
    # fails all 38 baselines. Left unpinned, uv keeps 1.0 so it can take
    # pytest 9 / syrupy 5, which is why a fresh worktree went red while the
    # install.sh venv (built by pip, which took 1.1) stayed green.
    "pytest-textual-snapshot>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# UI glue: framework generics and callbacks make full strict annotation noise;
# the pure core (db/ids/money/dates/models/repo/services/sync) stays fully strict.
module = ["bookkit.tui.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
